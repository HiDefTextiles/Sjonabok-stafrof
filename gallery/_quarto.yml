lang: en

website:
  title: "Sjónabókarstafróf"
  description: "Explore digitized letter charts, TXT stitch motifs, and source-inspired fonts from Sjónabók."
  site-url: https://hideftextiles.github.io/Sjonabok-stafrof/
  repo-url: https://github.com/HiDefTextiles/Sjonabok-stafrof
  repo-actions: [issue]
  favicon: img/hi/favicon.svg
  search: true
  navbar:
    logo: img/hi/hi_named_logo-en.svg
    logo-alt: "University of Iceland"
    background: primary
    left:
      - text: "Fonts"
        href: index.qmd
      - text: "Source groups and frames"
        href: font-families.qmd
      - text: "Test the fonts"
        href: font-test.qmd
      - text: "Similarity and coverage"
        href: font-similarity.qmd
    tools:
      - icon: github
        href: https://github.com/HiDefTextiles/Sjonabok-stafrof
        aria-label: GitHub
  page-footer:
    left: |
      Org preserves chart glyphs; Alt additions are marked in teal. The TXT grids are the reusable motif source; see the README for scope, attribution, and license details.
    right:
      - text: "Privacy"
        href: privacy.qmd
      - text: "Cookie settings"
        href: "#analytics-settings"
      - text: "Project README"
        href: https://github.com/HiDefTextiles/Sjonabok-stafrof#readme

format:
  html:
    theme:
      - cosmo
      - styles/hi-site.scss
      - styles/hidef.scss
      - styles/gallery.scss
    css:
      - styles/jost/jost.css
      - styles/hi-watermark.css
    include-in-header:
      # Cookie consent (Klaro!, as on hi.is) and the Google Tag Manager
      # container shared by the HiDef Textiles sites. Nothing is sent to
      # Google Analytics until the visitor accepts. See consent/consent.js.
      - text: |
          <meta name="ga-measurement-id" content="GTM-5XPW89B4" data-langs="en is"
            data-privacy-href="/Sjonabok-stafrof/privacy.html">
      - file: consent.html
    toc: true
    smooth-scroll: true
    anchor-sections: true
    link-external-newwindow: true
